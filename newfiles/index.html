<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shader Development Studio — A Creative Development Studio, Plugged into the Future"
    />
    <title>Shader Development Studio</title>

    <!-- Self-hosted fonts — declared before anything renders to prevent FOUC -->
    <style>
      @font-face {
        font-family: 'Playfair Display';
        src: url('/fonts/playfair-display-900.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Playfair Display';
        src: url('/fonts/playfair-display-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Playfair Display';
        src: url('/fonts/playfair-display-700-italic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/eb-garamond-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/eb-garamond-400-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: 'Courier Prime';
        src: url('/fonts/courier-prime-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
    </style>

    <!-- Preload the two most critical fonts -->
    <link
      rel="preload"
      href="/fonts/playfair-display-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/eb-garamond-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/courier-prime-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Shader Development Studio" />
    <meta
      property="og:description"
      content="A Creative Development Studio, Plugged into the Future"
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:url" content="https://shader.se" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shader Development Studio" />
    <meta
      name="twitter:description"
      content="A Creative Development Studio, Plugged into the Future"
    />
    <meta name="twitter:image" content="/images/og-image.jpg" />
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
